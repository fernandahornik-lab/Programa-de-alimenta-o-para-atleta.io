<header class="topo">

<section class="card">

  <div class="título">

  </h2>👤 Perfil do atleta</h2>

  <p>

    Informações para organização dos registros 
    
  </p>

  </div>

  <div class="grid-perfil">

    <div class="campos">

      <label>Nome</label>

      <input

        type="text"

        id="atletaNome"

        placeholder="Nome do atleta">

    </div>

      <label>Modalidades</label>

      <input

    </div>

    <div class="campos">

      <label>Equipe / Clube</label>

      <input

        type="text"

        id="equipe"

        placeholder="Nome da equipe">

    </div>

    <div class="campo">

      <label>Data</label>

      <input

        type="date"

        id="dataRegistro">

      </div>

    </div>

</section>
  
<!--RESUMO-->

<section class="dashboard">

  <div class="dashboard">

    <span>🍽</span>

    <div>

      <small>Refeições registradas</small>

      <strong id="totalRefeicoes">0</strong>
      
    </div>

  </div>

</div>

<div class="indicador agua">

  <span>🔥</span>

  <div>

    <small>Água registrada</small>

  </div>

</div>

 <div class="indicador sono">

 </div>

 <div class="indicador energia">

  <div>

   <small>Energia percebida</small>

  </div>

 </div>

</section>
