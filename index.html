 </DOCTYPE html>

 <html lang="pt-BR">
   
 <head>
   
 <meta charset="UTF-8">
   
 <meta name="viewport"content="width=device-width, initial-scale=1.0">


 <title>Controle de Alimentação do Atleta</title>
   
 <link rel="stylesheet"href="style.css">
   
</head>
   
<body>
  
<header class="topo">
  
<div class="marca">

<div class="icone-marca">🏆</div>

<div>

  <h1>AtletaControl</h1>

  <p>Controle de Alimentação e rotina esportiva</p>

 </div>


</div>

<button id="btnTema" class="btn-tema"

   🌙 Tema escura 

</button>

</header>

<main class="container">

<!--PERFIL-->

<section class="card">

  <div class="título">

  </h2>👤 Perfil do atleta</h2>

  <p>

    Informações para organização dos registros 
    
  </p>

  </div>

  <div class="grid-perfil">

    <div class="campos">

      <label>Nome</label>

      <input

        type="text"

        id="atletaNome"

        placeholder="Nome do atleta">

    </div>

    <div class="campos">

      <label>Modalidades</label>

      <input
        
        type="text"

        id="Modalidade"

        placeholder="Ex.:futebol">

    </div>

    <div class="campos">

      <label>Equipe / Clube</label>

      <input

        type="text"

        id="equipe"

        placeholder="Nome da equipe">

    </div>

    <div class="campo">

      <label>Data</label>

      <input

        type="date"

        id="dataRegistro">

      </div>

    </div>

</section>
  
<!--RESUMO-->

<section class="dashboard">

  <div class="dashboard">

    <span>🍽</span>

    <div>

      <small>Refeições registradas</small>

      <strong id="totalRefeicoes">0</strong>
      
    </div>

  </div>

</div>

<div class="indicador agua">

  <span>🔥</span>

  <div>

    <small>Água registrada</small>

    <strong id="aguaTotal">0 L</strong>

  </div>

</div>

 <div class="indicador sono">

   <span>😴</span>

   <div> 

    <small>Sono</small>

    <strong id="sonoTotal">--</strong>

   </div>

 </div>

 <div class="indicador energia">

   <span>⚡️</span>

  <div>

   
  </div>
